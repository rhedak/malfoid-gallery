prompt: "Redraw the woman in the uploaded image as a very rough, messy Japanese digital doodle (日系粗糙数字涂鸦), drawn quickly in a few minutes with a thick chunky crayon brush using a mouse in MS Paint, with no cleanup at all. The lines wobble and break: thick black crayon outlines that shake, stop and restart, double up, overlap and leave gaps, suddenly fat in one place and thin in the next, with a crude, naive scribble quality to the linework and grainy, waxy crayon texture. The colour fill visibly misses and overshoots the lines: flat opaque crayon colour that spills well past the outlines in places and leaves patches of white paper unpainted inside them. Shadows are only a few strokes of scribbled hatching in grey or a darker shade; highlights are quick, scratchy white streaks scratched across her hair, shoes and clothes. No clean lineart, no smooth or even lines, no neat edges, no tidy colouring inside the lines, no gradients. Keep her identity: the same face with her cool, haughty grown-up expression, long straight platinum-blonde hair with the thin braid at the side, teal-green eyes and small earring. She is a 21-year-old woman. Change only her clothes: instead of the uniform and robe she now wears a cozy cream knit sweater with a green scarf, a dark green plaid skirt, black tights and brown ankle boots. Keep everything else about her the same. Draw her as a stylised chibi caricature of an adult woman: a moderately larger head, about 1:4 head-to-body, simplified short arms and legs and mitten-like hands, while her haughty adult face, long hair with the side braid, earring and outfit still clearly read as the same grown-up young woman. Pose and expression: she stands holding a steaming mug of hot cocoa in both mitten-like hands in front of her, cheeks pink, with a tiny reluctant smile she is trying to hide behind the mug. Face simplified: eyes as thick black outlines with blocky teal colour, a tiny scribbled mouth, no nose, a couple of pink zig-zag blush scribbles. Hair as a few big scribbled platinum-blonde crayon blocks with white scratch highlights and no strands, the side braid drawn as a wobbly zigzag. Outfit as big flat colour blocks keeping its colours and silhouette, folds reduced to a few scribbled lines. Composition: full body from head to toe with both shoes visible, centred, with plenty of white space on a pure white background; no text, no scenery, no frame. Final check: it must look like a quick, sloppy mouse doodle, more unfinished than finished, never a polished illustration imitating a sketch: no refinement, no fine lineart, no detailed hair, no detailed fabric, no 3D look, no lighting effects."
