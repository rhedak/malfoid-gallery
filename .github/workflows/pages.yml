name: Pages

# Rebuilds the gallery site on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves. Nothing is force-pushed: the gh-pages history only grows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pillow pyyaml

      - name: Build the site
        run: python scripts/build_site.py --out "$RUNNER_TEMP/site"

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/pages"
          find "$RUNNER_TEMP/pages" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/site/." "$RUNNER_TEMP/pages/"
          cd "$RUNNER_TEMP/pages"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Build site from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD:gh-pages
