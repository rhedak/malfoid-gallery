# Daily Malfoid: November 2026 posting plan (one post a day, 28 posts, Nov 3-30).
# Each day posts `media`: the image, or on video days (type: video) the clip made from that image.
# A posting routine picks the day whose `date` is today (JST), posts `media` with the captions below,
# then fills `posted:` on the matching entry in gallery.yaml (same `id`).
# AI disclosure: every caption set carries #AIart / #AIgenerated / #AIanimation; also turn on
# Instagram's AI info label and TikTok's AI-generated content label where the app offers them.
# Rednote (Xiaohongshu, 小红书): every day has a `rednote` block (Chinese title max ~20 chars, body, tags).
# Rednote takes both image notes (图文笔记) and video notes (视频笔记), so image and video days can all be posted.
# When posting on Rednote, tick the AI-generated content declaration (声明: 内容由AI生成 / 含AI合成内容).
# No official franchise tags (no #HarryPotter / #Hogwarts, no #哈利波特 / #霍格沃茨). Suggested slot is only a suggestion.
series: "Daily Malfoid"
month: "2026-11"
suggested_slot: "20:00 JST (a suggestion; adjust freely)"
ai_disclosure:
  x: "#AIart in the hashtags; use any AI/content label X offers when posting"
  instagram: "#AIart #AIgenerated in the hashtags; turn on the AI info label where offered"
  tiktok: "#AIart / #AIanimation in the hashtags; turn on the AI-generated content label where offered"
  rednote: "#AI绘画 / #AI视频 in the tags; tick the AI-generated content declaration (内容由AI生成) when posting; image notes and video notes both supported, so every day (image or video) can be posted"
