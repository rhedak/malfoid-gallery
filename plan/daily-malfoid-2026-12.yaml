# Daily Malfoid: December 2026 posting plan (Advent calendar, 24 posts, Dec 1-24).
# Each day posts `media`: the advent calendar card (image) for that day, from the advent set.
# Each card is in gallery.yaml with the same `id`; the routine fills `posted:` there after posting.
# A posting routine picks the day whose `date` is today (JST), posts `media` with the captions below.
# Hashtags: max 5 per platform; always #DailyMalfoid, #malfoid (no original-character tags).
# AI disclosure: every caption set carries an AI tag (#AIart; Rednote #AI绘画); turn on the AI label where offered.
# Rednote: every day has a `rednote` block (Chinese title max ~20 chars, body, tags); tick the AI-generated
# content declaration (内容由AI生成) when posting. No official franchise tags.
# Numbering continues the November series: Daily Malfoid 29 = Advent 1 (Dec 1), 52 = Advent 24 (Dec 24).
series: "Daily Malfoid"
month: "2026-12"
suggested_slot: "20:00 JST (a suggestion; adjust freely)"
ai_disclosure:
  x: "#AIart in the hashtags; use any AI/content label X offers when posting"
  instagram: "#AIart in the hashtags; turn on the AI info label where offered"
  tiktok: "#AIart / #AIanimation in the hashtags; turn on the AI-generated content label where offered"
  rednote: "#AI绘画 in the tags; tick the AI-generated content declaration (内容由AI生成) when posting"
days:
  - date: 2026-12-01
    n: 29
    label: "Daily Malfoid 29"
    id: "2026-11-06-advent-01"
    type: image
    media: "images/2026-11-06-advent-01.jpg"
    image: "images/2026-11-06-advent-01.jpg"
    theme: "Advent 1: Opening an Advent gift"
    x:
      caption: "Advent 1 🎁 Day one, and she's already opening presents. Don't ask who they're for."
      hashtags: "#DailyMalfoid #malfoid #AIart #advent"
    instagram:
      format: "feed post"
      caption: "Advent 1 🎁 The calendar starts today. The gift is definitely not for you. Probably."
      hashtags: "#DailyMalfoid #malfoid #tsundere #AIart #christmas"
    tiktok:
