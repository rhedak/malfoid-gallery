# Pose phrases for scripts/ideas.py.
# source: most entries paraphrase pose NAMES (short factual descriptions) from
#   https://github.com/anhao/ai-pose-gallery-zh (data/pose-zh.json; Chinese translation by Anhao of
#   the pose gallery by ギア @giaaibusi, https://ai-pose-gallery.pages.dev/).
#   That repo's MIT licence covers only its code; its images and data (pose.json) belong to the
#   original author and are non-commercial. We copy no images and no data file: only our own English
#   paraphrase of a pose name, with the original id and Chinese name kept for traceability.
#   Only the "全身单人・标准系" (full body, standard) and "上半身单人・可爱系" (upper body, cute) lines were used;
#   the sexy/explicit lines and categories, lying-down, arched-back and chest-emphasis poses were skipped.
#   Entries with src_id null are our own.
# fields: text = verb phrase after "She ...", framing = full|upper, posture,
#   hands_busy = the pose occupies her hands, sets_gaze = the pose fixes where she looks, swim_ok = allowed with swimwear.
source:
  repo: "https://github.com/anhao/ai-pose-gallery-zh"
  file: "data/pose-zh.json"
  original: "https://ai-pose-gallery.pages.dev/ (ギア @giaaibusi)"
  license: "MIT for code only; pose data and images are the original author's, non-commercial. Names paraphrased, nothing vendored."
