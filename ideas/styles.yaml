# Art styles for scripts/ideas.py (the "style" lever).
# weight: relative chance when --style is not given (anime 80 : alternates 20 in total).
# anime is the house style: the prompt stays exactly as before (same art style as the base post).
# For the other styles the prompt keeps her identity and outfit from image 1 but redraws her in `text`;
# `background` replaces "full scene background" in the closing line.
# The style is drawn from its own RNG stream (seeded "style-<seed>"), so the other fields of a seed don't change.
styles:
  - id: "anime"
    name: "house anime style"
    weight: 80
    default: true
  - id: "rough-doodle"
    name: "rough Japanese digital doodle (粗糙数字涂鸦)"
    weight: 5
    source: "https://x.com/798145343h/status/2117499225206317377"
    background: "plain white paper background with natural white space and only a few loose doodled hints of the setting, no text, no frame"
    text: "Art style: a very rough, messy Japanese digital doodle (日系粗糙数字涂鸦), drawn quickly in a few minutes with a thick chunky crayon brush using a mouse in MS Paint, with no cleanup at all. The lines wobble and break: thick black crayon outlines that shake, stop and restart, double up, overlap and leave gaps, suddenly fat in one place and thin in the next, with a crude, naive scribble quality to the linework and grainy, waxy crayon texture; no clean lineart, no smooth or even lines. The colour fill visibly misses and overshoots the lines: flat opaque crayon colour that spills well past the outlines in places and leaves patches of white paper unpainted inside them; shadows are only a few strokes of scribbled hatching in grey or a darker shade; highlights are quick, scratchy white streaks; no gradients, no lighting effects, no tidy colouring inside the lines. Face simplified: eyes as thick black outlines with blocky colour keeping her eye colour and expression, a tiny scribbled mouth, no nose, a couple of pink zig-zag blush scribbles. Hair as a few big scribbled crayon blocks with white scratch highlights and no strands, but keeping her exact hairstyle, braid and hair colour. Outfit as big flat colour blocks keeping its colours, silhouette and signature accessories, folds reduced to a few scribbled lines; don't change or add clothes or accessories. Keep her adult proportions (a 21-year-old woman); the head may be only slightly larger. It must look like a quick, sloppy mouse doodle, more unfinished than finished, never a polished illustration imitating a sketch: no refinement, no fine lineart, no detailed hair, no 3D look."
  - id: "watercolor"
    name: "soft watercolor"
    weight: 5
    background: "soft watercolor wash background of the setting, loose and lightly detailed, with some white paper showing at the edges"
    text: "Art style: a hand-painted anime watercolor illustration on textured cold-press paper, delicate pencil underdrawing still visible, soft transparent washes with blooms and gentle colour bleeds, light and airy palette, keeping her face, hairstyle, braid, hair and eye colour and her outfit's colours and details exactly."
  - id: "cel-90s"
    name: "90s cel-shaded anime"
    weight: 4
    background: "painted 90s anime background art of the setting"
    text: "Art style: a 1990s TV anime cel, hard-edged two-tone cel shading, clean ink outlines, slightly muted retro colours, subtle film grain and a soft analog glow, 4:3 retro anime look, keeping her face, hairstyle, braid, hair and eye colour and her outfit's colours and details."
  - id: "picture-book"
    name: "pastel picture book"
    weight: 3
    background: "simple storybook background of the setting in soft pastel shapes"
    text: "Art style: a gentle pastel picture-book illustration, soft coloured-pencil and gouache texture, rounded simplified shapes, warm muted pastel palette, cozy storybook mood, keeping her face, hairstyle, braid, hair and eye colour and her outfit's colours and details."
  - id: "pencil-sketch"
    name: "sketchbook pencil"
    weight: 3
    background: "lightly sketched setting fading out into blank sketchbook paper"
    text: "Art style: an anime sketchbook page in graphite pencil with light colour accents only on her hair, eyes and outfit trim, confident construction lines, soft hatching for shadows, visible paper texture, keeping her face, hairstyle, braid, eye colour and her outfit's shapes and details."
