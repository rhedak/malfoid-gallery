# Expressions for scripts/ideas.py; she is a tsundere, so most lean that way.
# text follows the pose after a comma: "She <pose>, <emotion>".
# uses_hands: true = the expression includes a gesture, so it is paired only with poses whose hands are free.
# sets_gaze: true = says where she looks, so never paired with a pose that also does.
# swim_ok: allowed with swimwear (none of these are suggestive; flirty/seductive expressions are not allowed at all).
emotions:
  - id: "pouty-blush-away"
    name: "pouty blush"
    text: "looking away with a pouty blush"
    tsundere: true
    uses_hands: false
    sets_gaze: true
    swim_ok: true
  - id: "arms-crossed-away"
    name: "arms crossed"
    text: "arms crossed, turning her face away with a pouty blush"
    tsundere: true
    uses_hands: true
    sets_gaze: true
    swim_ok: true
  - id: "flustered-glare"
    name: "flustered glare"
    text: "glaring at the viewer with a flustered blush"
    tsundere: true
    uses_hands: false
    sets_gaze: true
    swim_ok: true
  - id: "smug-pink"
