# Settings for scripts/ideas.py. No franchise names: say "castle magic school", not brand names.
# seasons: spring|summer|autumn|winter|any.  themes: empty = everyday, else only for those themes.
# tags: castle, indoor, outdoor, formal, beach, pool, city ...
# coverage: optional list of coverage levels allowed here.  ambience: false = no season phrase.
# ground: where she sits/kneels in floor poses (replaces "the floor" in the pose description);
#   settings without `ground` only get standing and upper-body poses.
season_ambience:
  spring: "cherry blossoms and fresh green leaves"
  summer: "bright summer sunshine"
  autumn: "golden and red autumn leaves drifting down"
  winter: "snow falling softly"
theme_decor:
  christmas: "decorated for Christmas with garlands, ornaments and warm fairy lights"
  halloween: "decorated for Halloween with carved jack-o'-lanterns and candles"
  thanksgiving: "decorated for an autumn harvest with pumpkins and corn sheaves"
  new-year: "decorated for New Year with paper lanterns and gold streamers"
  valentines: "decorated for Valentine's Day with red roses and small heart garlands"
  summer-festival: "strung with paper lanterns for a summer festival"
  black-friday: "with big red BLACK FRIDAY SALE banners and discount signs everywhere"
settings:
  - id: "great-hall"
    name: "great hall"
    text: "the great hall of an old stone castle magic school, long wooden tables and floating candles under an enchanted starry ceiling"
    seasons: [any]
    tags: [castle, indoor, formal]
    themes: []
