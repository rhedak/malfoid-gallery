# Outfits for scripts/ideas.py.
# base: which base post + reference to edit from (see `bases`).
# canonical: true = one of her own outfits; the prompt says "wearing the same ..." and "Don't redesign the <keep>."
# coverage: a level from ideas/skin.yaml.  seasons: spring|summer|autumn|winter|any.
# themes: empty = everyday; otherwise only used with those themes.
# requires_setting_tags: the setting must carry at least one of these tags.
bases:
  uniform:
    post: "https://grok.com/imagine/post/a22d4f44-ee90-468f-be10-7f3f6094b544"
    reference: "references/draconia-uniform-fullbody.jpg"
    # full-body edit (2026-11-03) of the thigh-cropped post b719bfd8 (references/draconia-uniform.webp)
    # transparent version: references/draconia-uniform-fullbody-transparent.png, Grok Imagine Remove Background
    # of a22d4f44 -> https://grok.com/imagine/post/f0a396f0-93a5-4d73-a4ee-8112f5ea7fad (faint pink fringe at robe hem and loafer soles)
  vest:
    post: "https://grok.com/imagine/post/918f66cf-6f2d-422f-bcdd-0eac54f9752d"
    reference: "references/draconia-vest-fullbody.jpg"
    # full-body edit (2026-11-03) of the thigh-cropped post 3da5bf18 (references/draconia-vest.webp)
    # transparent version: references/draconia-vest-fullbody-transparent.png, Grok Imagine Remove Background
    # of 918f66cf -> https://grok.com/imagine/post/23617d71-a87f-410a-b5f5-cb40c4d5f34f (faint pink fringe at loafer soles)
  gown:
    post: "https://grok.com/imagine/post/d9b008f8-7f62-4cd4-80d7-ac9ebc7ef733"
    reference: "references/draconia-gown.webp"
outfits:
  - id: "uniform-robe"
    name: "school uniform with robe"
    text: "the same black robe with green lining, white shirt, green and silver striped tie, grey vest, grey pleated skirt, black knee-high socks and polished black loafers"
    keep: "uniform"
    base: "uniform"
    canonical: true
    coverage: "modest"
    seasons: [any]
    themes: []
  - id: "uniform-robe-scarf"
